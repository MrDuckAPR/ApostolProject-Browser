# Полный список команд приложения (generate_handler! в main.rs).
#
# ВАЖНО: как только у приложения появляется хотя бы один свой файл в
# permissions/, Tauri перестаёт неявно разрешать "все свои команды всем
# окнам по умолчанию" и требует explicit allow для КАЖДОЙ команды — включая
# те, что и раньше прекрасно работали без единого файла разрешений (page_open
# и т.п.). Поэтому здесь перечислены ВСЕ команды, а не только новые
# shell_open_tab/shell_hotkey — иначе всё остальное молча ломается с
# "<command> not allowed".
[[permission]]
identifier = "allow-app-commands"
description = "Allows invoking every command defined directly in the APB application binary."
commands.allow = [
    "list_profiles",
    "create_profile",
    "create_anonymous_profile",
    "switch_profile",
    "rename_profile",
    "active_profile",
    "delete_profile",
    "add_bookmark",
    "search_bookmarks",
    "record_visit",
    "recent_history",
    "clear_history",
