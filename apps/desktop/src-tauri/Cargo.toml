[package]
name = "apb-desktop"
version = "0.2.8"
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
# Официальный плагин: второй запуск не плодит второй браузер на том же
# user-data folder (это ломало WebView2 и сессию), а будит существующее окно.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.10.0", features = ["v4", "serde"] }
time = { workspace = true }
chrono = { workspace = true }
ureq = { workspace = true }
minisign-verify = "0.2"
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Та же версия `windows`, что у tauri-runtime-wry/webview2-com: её HWND-тип
# совместим с ParentWindow() контроллера вебвью (для подъёма оверлея наверх).
"windows" = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
] }

apb-storage = { path = "../../../crates/storage" }
apb-profiles = { path = "../../../crates/profiles" }
apb-bookmarks = { path = "../../../crates/bookmarks" }
apb-history = { path = "../../../crates/history" }
apb-tabs = { path = "../../../crates/tabs" }
apb-commands = { path = "../../../crates/commands" }
apb-notes = { path = "../../../crates/notes" }
apb-privacy = { path = "../../../crates/privacy" }
apb-network = { path = "../../../crates/network" }
apb-vault = { path = "../../../crates/vault" }
apb-ai = { path = "../../../crates/ai" }
apb-extensions = { path = "../../../crates/extensions" }

[[bin]]
name = "apb-desktop"
path = "src/main.rs"
