      mode = "omni";
      menu.classList.add("omni");
      (payload.items || []).forEach(function (it) {

        el.className = "item" + (it.sel ? " sel" : "");

      menu.style.top = "0px";

    (payload.items || []).forEach(function (it) {

      el.className = it.danger ? "item danger" : "item";
      el.textContent = txt(it.label);
      el.dataset.action = txt(it.action);
      menu.appendChild(el);
    });
    if (!menu.childElementCount) { hide(); return; }
    var menuW = menu.offsetWidth || 210;
    var menuH = menu.offsetHeight || 160;

    menu.style.left = x + "px";
    menu.style.top = y + "px";

      } else {
        try { if (I && I.invoke) I.invoke("overlay_hide", { id: (window.__apbId || "") }).catch(function(){}); } catch (_e) {}
